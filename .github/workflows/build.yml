name: Build Slivy VPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: V2rayNG  # <--- Указываем, где искать gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: V2rayNG  # <--- Собираем тоже оттуда

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlivyVPN-Debug
          # Путь к APK тоже может измениться, проверь, если сборка пройдет, но файл не найдется
          path: V2rayNG/app/build/outputs/apk/debug/*.apk