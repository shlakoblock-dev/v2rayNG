name: Build Slivy VPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ДОБАВЛЯЕМ PYTHON 3.11 ДЛЯ CHAQUOPY
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download libv2ray
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          echo "Размер скачанного файла:"
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: V2rayNG

      - name: Build Debug APK
        run: ./gradlew assembleFdroidDebug
        working-directory: V2rayNG

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlivyVPN-Debug
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk